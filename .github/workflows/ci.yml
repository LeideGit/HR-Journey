# CI för HR Journey. PRD: NFR-014, OPS-007, TEST-OPS-001. FEAT-012.
# Blockerar merge vid fel. Inga hemligheter används här. Endast fiktiv data.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Beroenden kräver Node 22 eller 24 (package.json engines).
          node-version: '22'
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Spec-validering
        run: node scripts/validate-specs.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Hemlighetsskanning av bygget
        run: |
          # Matchar faktiska nyckelvärden, inte prefix. supabase-js innehåller strängen sb_secret_ som kod.
          if grep -r -l -E 'sb_secret_[A-Za-z0-9_-]{10,}|eyJhbGciOi[A-Za-z0-9_-]{20,}' dist; then
            echo "Hemlighet hittad i bygget. Avbryter."
            exit 1
          fi
          echo "inga hemligheter i dist"

  rls:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Installera Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Starta lokal Supabase
        run: supabase start

      - name: Kör RLS-tester
        run: |
          for f in supabase/tests/rls_*.sql; do
            echo "== $f"
            out=$(docker exec -i "$(docker ps --format '{{.Names}}' | grep supabase_db_ | head -1)" psql -U postgres -d postgres -v ON_ERROR_STOP=0 -f - < "$f" 2>&1)
            echo "$out" | grep -E 'NOTICE: +TEST' | sed 's/^.*NOTICE: *//'
            if echo "$out" | grep -q 'FAIL'; then echo "FAIL i $f"; exit 1; fi
          done

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Bygg för GitHub Pages
        run: npm run build
        env:
          # Publik nyckel för hostat projekt. Lagras som repository variable, inte secret,
          # eftersom den ska finnas i frontend-bundlen.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
